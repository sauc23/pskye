<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --neon-pink: #ff71ce;
      --neon-blue: #01cdfe;
      --neon-green: #05ffa1;
      --neon-purple: #b967ff;
    }

    body {
      font-family: 'Press Start 2P', cursive;
      background: #000;
      overflow: hidden;
      color: var(--neon-green);
    }

    .grid-bg {
      background: 
        linear-gradient(var(--neon-purple) 0.1em, transparent 0.1em) 0 0,
        linear-gradient(90deg, var(--neon-purple) 0.1em, transparent 0.1em) 0 0;
      background-size: 3em 3em;
      background-color: #000;
      opacity: 0.1;
    }

    .scanline {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0)
      );
      pointer-events: none;
      animation: scanline 6s linear infinite;
    }

    .neon-text {
      text-shadow: 0 0 5px var(--neon-green),
                   0 0 10px var(--neon-green),
                   0 0 20px var(--neon-green);
      animation: flicker 3s infinite;
    }

    .chat-container {
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green),
                 inset 0 0 10px var(--neon-green);
      min-height: 24rem; 
      max-height: 24rem;
      overflow-y: auto;
      word-wrap: break-word;
      word-break: break-word;
    }

    .retro-btn {
      border: 2px solid var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
      text-shadow: 0 0 5px var(--neon-pink);
      transition: all 0.3s ease;
    }

    .retro-btn:hover {
      background: var(--neon-pink);
      color: #000;
      transform: scale(1.05);
    }

    .retro-input {
      background: rgba(5, 255, 161, 0.1);
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 5px var(--neon-green);
      color: var(--neon-green);
    }

    #chat > div {
      max-width: 100%;
      overflow-wrap: break-word;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 22%, 24%, 55% {
        opacity: 0.5;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--neon-green);
      border-radius: 4px;
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading-text {
      margin-top: 20px;
      letter-spacing: 2px;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(5, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80% { content: '...'; }
      100% { content: ''; }
    }

    .admin-mode {
      border-color: var(--neon-pink) !important;
      box-shadow: 0 0 10px var(--neon-pink),
                 inset 0 0 10px var(--neon-pink) !important;
    }

    #adminPanel {
      display: none;
    }

    .admin-controls {
      border: 2px solid var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
      background: rgba(255, 113, 206, 0.1);
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <h1 class="text-4xl neon-text">SKYECHAT</h1>
    <p class="loading-text neon-text">CONNECTING<span class="loading-dots"></span></p>
  </div>
  <div class="grid-bg fixed inset-0"></div>
  <div class="scanline fixed inset-0"></div>
  
  <div class="relative flex flex-col items-center justify-center min-h-screen p-4 z-10">
    <h1 class="text-4xl mb-8 neon-text tracking-wider">ARCADE CHAT</h1>
    
    <div class="flex w-full max-w-4xl gap-6">
      <div class="flex-1">
        <div id="chat" class="chat-container h-96 overflow-y-auto p-4 mb-4 rounded-lg bg-black bg-opacity-80"></div>
        
        <div class="flex gap-3">
          <input type="text" id="username" placeholder="HANDLE" class="retro-input p-3 w-1/3 rounded-lg">
          <input type="text" id="messageInput" placeholder="MESSAGE" class="retro-input p-3 flex-1 rounded-lg">
          <button id="sendButton" class="retro-btn px-6 py-3 rounded-lg">SEND</button>
        </div>
      </div>
      
      <div class="w-64">
        <div class="chat-container p-4 rounded-lg bg-black bg-opacity-80">
          <h2 class="text-lg mb-4 neon-text">PLAYERS ONLINE</h2>
          <ul id="userList" class="space-y-2"></ul>
        </div>

        <div id="adminSection" class="mt-6 chat-container p-4 rounded-lg bg-black bg-opacity-80">
          <div id="adminLoginForm">
            <h2 class="text-lg mb-4 neon-text">ADMIN ACCESS</h2>
            <input type="text" id="adminUsername" placeholder="ADMIN ID" class="retro-input p-2 w-full rounded-lg mb-2">
            <input type="password" id="adminPassword" placeholder="PASSWORD" class="retro-input p-2 w-full rounded-lg mb-2">
            <button id="adminLoginButton" class="retro-btn w-full p-2 rounded-lg">LOGIN</button>
            <div id="adminLoginError" class="mt-2 text-xs text-red-500"></div>
          </div>
          <div id="adminInfo" class="hidden">
            <h2 class="text-lg mb-4 neon-text">ADMIN PANEL</h2>
            <p class="text-neon-pink mb-4">Welcome, Admin!</p>
            <button id="adminLogoutButton" class="retro-btn w-full p-2 rounded-lg">LOGOUT</button>
          </div>
        </div>
      </div>
    </div>

    <div id="adminPanel" class="mt-6 w-full max-w-4xl">
      <div class="admin-controls">
        <h2 class="text-lg mb-4 neon-text">ADMIN CONTROLS</h2>
        <div class="space-y-2">
          <div class="flex gap-2">
            <input type="text" id="banUsername" placeholder="USERNAME TO BAN" class="retro-input p-2 flex-1 rounded-lg">
            <button id="banButton" class="retro-btn px-4 py-2 rounded-lg">BAN USER</button>
          </div>
          <button id="clearChatButton" class="retro-btn w-full p-2 rounded-lg">CLEAR CHAT</button>
        </div>
      </div>
    </div>

    <div id="pinnedMessage" class="fixed top-4 left-1/2 transform -translate-x-1/2 chat-container p-4 rounded-lg bg-black bg-opacity-90 hidden">
      <div class="flex justify-between items-center">
        <h3 class="text-sm neon-text">PINNED MESSAGE</h3>
        <button id="unpinButton" class="text-xs retro-btn px-2 py-1 rounded">UNPIN</button>
      </div>
      <p id="pinnedContent" class="mt-2"></p>
    </div>
  </div>

  <script>
    const elements = {
      chat: document.getElementById('chat'),
      messageInput: document.getElementById('messageInput'),
      sendButton: document.getElementById('sendButton'),
      username: document.getElementById('username'),
      adminLogin: document.getElementById('adminLoginButton'),
      adminUsername: document.getElementById('adminUsername'),
      adminPassword: document.getElementById('adminPassword'),
      adminLoginError: document.getElementById('adminLoginError'),
      userList: document.getElementById('userList'),
      loadingScreen: document.getElementById('loadingScreen'),
      adminPanel: document.getElementById('adminPanel'),
      banUsername: document.getElementById('banUsername'),
      banButton: document.getElementById('banButton'),
      clearChatButton: document.getElementById('clearChatButton'),
      pinnedMessage: document.getElementById('pinnedMessage'),
      pinnedContent: document.getElementById('pinnedContent'),
      unpinButton: document.getElementById('unpinButton'),
    };

    let isAdmin = false;
    let selectedMessageId = null;

    const socket = io('wss://chat.jdx3.org');

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playRetroSound(frequency = 600, duration = 50, type = 'square') {
      try {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration/1000);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration/1000);
      } catch (e) {
        console.warn('Audio playback failed:', e);
      }
    }

    const sounds = {
      type: () => playRetroSound(800, 20, 'square'),
      send: () => playRetroSound(1000, 100, 'square'),
      error: () => playRetroSound(200, 300, 'sawtooth')
    };

    socket.on('connect', () => {
      setTimeout(() => {
        elements.loadingScreen.style.display = 'none';
        sounds.send();
      }, 2000);
    });

    socket.on('messageHistory', (messages) => {
      elements.chat.innerHTML = '';
      messages.forEach(displayMessage);
    });

    socket.on('chat', displayMessage);

    socket.on('activeUsers', (count) => {
      elements.userList.innerHTML = `
        <li class="flex items-center">
          <span class="inline-block w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
          ACTIVE: ${count}
        </li>
      `;
    });

    socket.on('error', (message) => {
      sounds.error();
      alert(message);
    });

    socket.on('adminLoginSuccess', () => {
      isAdmin = true;
      sounds.send();
      elements.adminPanel.style.display = 'block';
      elements.chat.classList.add('admin-mode');
      
      // Hide login form and show admin info
      document.getElementById('adminLoginForm').classList.add('hidden');
      document.getElementById('adminInfo').classList.remove('hidden');
      
      // Hide just the username input since admin has fixed username
      elements.username.classList.add('hidden');
      elements.username.value = 'axPQedfAWvkN4Hgg2NNN'; // Set admin username
    });

    socket.on('messageDeleted', (messageId) => {
      const messageEl = document.querySelector(`[data-message-id="${messageId}"]`);
      if (messageEl) {
        messageEl.remove();
        sounds.error();
      }
    });

    socket.on('messageUpdated', (message) => {
      const messageEl = document.querySelector(`[data-message-id="${message.id}"] .message-content`);
      if (messageEl) {
        messageEl.textContent = message.content;
        sounds.send();
      }
    });

    socket.on('chatCleared', () => {
      elements.chat.innerHTML = '';
      sounds.error();
    });

    // Add logout handler
    document.getElementById('adminLogoutButton').addEventListener('click', () => {
      isAdmin = false;
      elements.adminPanel.style.display = 'none';
      elements.chat.classList.remove('admin-mode');
      
      // Show login form and hide admin info
      document.getElementById('adminLoginForm').classList.remove('hidden');
      document.getElementById('adminInfo').classList.add('hidden');
      
      // Show username input again
      elements.username.classList.remove('hidden');
      elements.username.value = '';
      
      sounds.error();
    });

    elements.messageInput.addEventListener('keypress', (e) => {
      sounds.type();
      if (e.key === 'Enter') sendMessage();
    });

    elements.sendButton.addEventListener('click', sendMessage);

    elements.adminLogin.addEventListener('click', () => {
      const username = elements.adminUsername.value.trim();
      const password = elements.adminPassword.value.trim();
      if (username && password) {
        socket.emit('adminLogin', { username, password });
      } else {
        sounds.error();
        elements.adminLoginError.textContent = 'INVALID CREDENTIALS';
      }
    });

    elements.banButton.addEventListener('click', () => {
      const username = elements.banUsername.value.trim();
      if (username && isAdmin) {
        socket.emit('banUser', username);
        elements.banUsername.value = '';
        sounds.send();
      }
    });

    elements.clearChatButton.addEventListener('click', () => {
      if (isAdmin && confirm('Clear all messages?')) {
        socket.emit('clearChat');
        sounds.error();
      }
    });

    elements.unpinButton.addEventListener('click', () => {
      if (isAdmin) {
        socket.emit('pinMessage', null);
        sounds.send();
      }
    });

    function displayMessage(data) {
      const messageEl = document.createElement('div');
      messageEl.classList.add('mb-2', 'p-2', 'rounded', 'bg-opacity-20');
      messageEl.setAttribute('data-message-id', data.id);
      
      let usernameColor;
      if (data.username === 'axPQedfAWvkN4Hgg2NNN') {
        usernameColor = 'yellow'; 
        data.username = 'ADMIN'; 
      } else if (data.username === elements.username.value) {
        usernameColor = 'var(--neon-pink)'; 
      } else {
        usernameColor = 'var(--neon-blue)'; 
      }
      
      let messageHTML = `
        <span style="color: ${usernameColor}">
          ${data.username}:
        </span> 
        <span class="ml-2 message-content">${data.content}</span>
      `;

      if (isAdmin) {
        messageHTML += `
          <div class="flex gap-2 mt-1">
            <button class="text-xs retro-btn px-2 py-1" onclick="editMessage('${data.id}')">EDIT</button>
            <button class="text-xs retro-btn px-2 py-1" onclick="deleteMessage('${data.id}')">DELETE</button>
            <button class="text-xs retro-btn px-2 py-1" onclick="pinMessage('${data.id}')">PIN</button>
          </div>
        `;
      }

      messageEl.innerHTML = messageHTML;
      elements.chat.appendChild(messageEl);
      elements.chat.scrollTop = elements.chat.scrollHeight;
    }

    function editMessage(messageId) {
      const messageEl = document.querySelector(`[data-message-id="${messageId}"] .message-content`);
      const newContent = prompt('Edit message:', messageEl.textContent);
      if (newContent !== null && newContent.trim() !== '') {
        socket.emit('editMessage', { 
          messageId, 
          newContent: newContent.trim(),
          isAdmin,
          username: elements.username.value 
        });
      }
    }

    function deleteMessage(messageId) {
      if (confirm('Delete this message?')) {
        socket.emit('deleteMessage', { 
          messageId,
          isAdmin,
          username: elements.username.value 
        });
      }
    }

    function pinMessage(messageId) {
      socket.emit('pinMessage', { messageId, isAdmin });
    }

    function sendMessage() {
      const username = elements.username.value.trim();
      const message = elements.messageInput.value.trim();
      
      if ((isAdmin || username) && message) {
        sounds.send();
        socket.emit('chat', { 
          username, 
          content: message,
          isAdmin 
        });
        elements.messageInput.value = '';
        elements.adminLoginError.textContent = '';
      } else {
        sounds.error();
        if (!isAdmin && !username) elements.username.classList.add('border-red-500');
        if (!message) elements.messageInput.classList.add('border-red-500');
        setTimeout(() => {
          elements.username.classList.remove('border-red-500');
          elements.messageInput.classList.remove('border-red-500');
        }, 1000);
      }
    }
  </script>
</body>
</html>
